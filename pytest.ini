[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:main

# Playwright setup.
addopts = --browser chromium --strict-markers

markers =
    smoke: Quick sanity check
    regression: Full test sweeps
base_url = http://127.0.0.1:8000