name: CI

on:
  pull_request:
  push:
    branches: [main]

# Never put real passwords or keys in this file.
env:
  # FAKE placeholder: overridden in tests by the Postgres test container
  DB_CONNECTION: "postgresql+psycopg://test:test@localhost:5432/test_db" #Fake
  DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_db"  #Fake
  REDIS_URL: "redis://localhost:6379/0" #Fake
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  JWT_SECRET_KEY:  ${{ secrets.JWT_SECRET_KEY }}
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: pytest -m smoke -v

  full:
    name: Full test suite
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests
        run: pytest -v --ignore=tests/ui